spring:
  application:
    name: agentic-rag-mcp-assistant
  datasource:
    # Postgres in Docker (see docker-compose.yml). Local dev-only credentials, not a real secret.
    url: jdbc:postgresql://localhost:5432/ragdb
    username: raguser
    password: ragpass
    driver-class-name: org.postgresql.Driver
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.1:8b
      embedding:
        options:
          model: nomic-embed-text
    chat:
      memory:
        repository:
          jdbc:
            # "embedded" (the default) never triggers for Postgres, since it's never an
            # embedded DB. The DDL is idempotent (CREATE ... IF NOT EXISTS), so re-running
            # it on every startup is safe.
            initialize-schema: always
    vectorstore:
      pgvector:
        dimensions: 768               # must match nomic-embed-text's embedding size
        distance-type: COSINE_DISTANCE
        index-type: NONE              # flat/exact nearest-neighbor scan; no ANN index needed at this corpus size
        initialize-schema: true

rag:
  ingestion:
    docs-location: rag-docs
    chunk-size: 800
  retrieval:
    top-k: 4
    similarity-threshold: 0.5

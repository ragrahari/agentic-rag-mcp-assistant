spring:
  application:
    name: agentic-rag-mcp-assistant
  datasource:
    # Postgres in Docker (see docker-compose.yml). Local dev-only credentials, not a real secret.
    url: jdbc:postgresql://localhost:5432/ragdb
    username: raguser
    password: ragpass
    driver-class-name: org.postgresql.Driver
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.1:8b
      embedding:
        options:
          model: nomic-embed-text
    chat:
      memory:
        repository:
          jdbc:
            # "embedded" (the default) never triggers for Postgres, since it's never an
            # embedded DB. The DDL is idempotent (CREATE ... IF NOT EXISTS), so re-running
            # it on every startup is safe.
            initialize-schema: always
    vectorstore:
      pgvector:
        dimensions: 768               # must match nomic-embed-text's embedding size
        distance-type: COSINE_DISTANCE
        index-type: NONE              # flat/exact nearest-neighbor scan; no ANN index needed at this corpus size
        initialize-schema: true
    mcp:
      client:
        name: agentic-rag-mcp-assistant
        # Bounded, not a hang: if the card server is slow/unreachable, a tool call fails
        # clearly within 5s instead of the 20s default.
        request-timeout: 5s
        initialized: false
        toolcallback:
          # Disables Spring AI's auto-registered ToolCallbackProvider bean. Its mere
          # presence in the context makes an unrelated bean --
          # ToolCallingAutoConfiguration's toolCallbackResolver, built while wiring the
          # Ollama chat model -- eagerly call getToolCallbacks() (a live list_tools) at
          # app startup, regardless of @Lazy on any of *our* injection points. Proven via
          # a cold-start test with the card server down: app failed to start entirely
          # with "Client failed to initialize listing tools" several frames deep in
          # OllamaChatAutoConfiguration -> ToolCallingAutoConfiguration.
          # ChatController builds its own SyncMcpToolCallbackProvider per request instead
          # (inside a try/catch), from the McpSyncClient list directly.
          enabled: false
        sse:
          connections:
            card-server:
              url: http://localhost:8081

rag:
  ingestion:
    docs-location: rag-docs
    chunk-size: 800
  retrieval:
    top-k: 4
    similarity-threshold: 0.5

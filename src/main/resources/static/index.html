<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Agentic RAG + MCP Assistant</title>
    <style>
      :root {
        --background: #f5f5f5;
        --surface: #ffffff;
        --border: #dedede;
        --text: #171717;
        --muted: #737373;
        --accent: #2563eb;
        --accent-hover: #1d4ed8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        max-width: 820px;
        margin: 0 auto;
        padding: 48px 20px;
        background: var(--background);
        color: var(--text);
      }
      h1 {
        font-size: 26px;
        font-weight: 650;
        letter-spacing: -0.02em;
        margin-bottom: 24px;
      } /* Chat window */
      #log {
        min-height: 420px;
        max-height: 620px;
        padding: 20px;
        margin-bottom: 14px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow-y: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      } /* Messages */
      .msg {
        padding: 14px 0;
        border-bottom: 1px solid #eeeeee;
        line-height: 1.55;
      }
      .msg:last-child {
        border-bottom: none;
      }
      .msg .role {
        display: block;
        margin-bottom: 5px;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        letter-spacing: 0.04em;
      } /* User message */
      .msg.you .role {
        color: var(--accent);
      } /* Assistant message */
      .msg.assistant .role {
        color: var(--muted);
      } /* Input area */
      form {
        display: flex;
        gap: 8px;
      }
      input[type="text"] {
        height: 44px;
        padding: 0 12px;
        font-family: inherit;
        font-size: 14px;
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 7px;
        outline: none;
      }
      input[type="text"]:focus {
        border-color: var(--accent);
      }
      #tenant {
        flex: 0 0 100px;
      }
      #message {
        flex: 1;
      }
      button {
        height: 44px;
        padding: 0 18px;
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        color: white;
        background: var(--accent);
        border: none;
        border-radius: 7px;
        cursor: pointer;
      }
      button:hover {
        background: var(--accent-hover);
      }
      button:active {
        transform: translateY(1px);
      }
    </style>
  </head>
  <body>
    <h1>Agentic RAG + MCP Assistant</h1>
    <div id="log"></div>
    <form id="chat-form">
      <input
        type="text"
        id="tenant"
        placeholder="Tenant"
        value="acme"
        autocomplete="off"
      />
      <input
        type="text"
        id="message"
        placeholder="Ask something..."
        autocomplete="off"
        autofocus
      />
      <button type="submit">Send</button>
    </form>

    <script>
      const conversationId = crypto.randomUUID();
      const log = document.getElementById("log");
      const form = document.getElementById("chat-form");
      const input = document.getElementById("message");
      const tenantInput = document.getElementById("tenant");

      function appendMessage(role) {
        const div = document.createElement("div");
        div.className = "msg";
        const roleSpan = document.createElement("span");
        roleSpan.className = "role";
        roleSpan.textContent = role + ": ";
        const textSpan = document.createElement("span");
        div.appendChild(roleSpan);
        div.appendChild(textSpan);
        log.appendChild(div);
        return textSpan;
      }

      async function sendMessage(message, tenantId) {
        appendMessage("You").textContent = `[${tenantId}] ${message}`;
        const responseSpan = appendMessage("Assistant");

        const res = await fetch("/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Tenant-Id": tenantId,
          },
          body: JSON.stringify({ message, conversationId }),
        });

        if (!res.ok || !res.body) {
          // The guardrail (and other server-side denials) respond with a JSON body of the
          // form {status, error, reason} -- see ApiExceptionHandler. Fall back to a generic
          // message if the body isn't that shape (e.g. a non-JSON 5xx from somewhere else).
          let reason = `Request failed (${res.status})`;
          try {
            const errorBody = await res.json();
            if (errorBody && errorBody.reason) {
              reason = errorBody.reason;
            }
          } catch (e) {
            // Body wasn't JSON; keep the generic fallback above.
          }
          responseSpan.textContent = reason;
          return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          let eventEnd;
          while ((eventEnd = buffer.indexOf("\n\n")) !== -1) {
            const rawEvent = buffer.slice(0, eventEnd);
            buffer = buffer.slice(eventEnd + 2);

            // Spring's Flux<String> SSE writer emits "data:<content>" with no separator space,
            // so the token's own leading space (common with word-piece tokenization) must be
            // kept as-is — do not strip it.
            const dataLines = rawEvent
              .split("\n")
              .filter((line) => line.startsWith("data:"))
              .map((line) => line.slice(5));

            if (dataLines.length > 0) {
              responseSpan.textContent += dataLines.join("\n");
            }
          }
        }
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const message = input.value.trim();
        const tenantId = tenantInput.value.trim();
        if (!message || !tenantId) return;
        input.value = "";
        sendMessage(message, tenantId);
      });
    </script>
  </body>
</html>
